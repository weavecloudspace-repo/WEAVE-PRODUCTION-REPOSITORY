name: Temporary CBT rollback Ruff formatting
on:
  push:
    branches:
      - feature/cbt-draft-result-rollback-20261027
    paths:
      - .github/workflows/format-cbt-rollback.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cbt-draft-result-rollback-20261027
      - uses: astral-sh/setup-uv@v5
      - name: Ruff-format touched backend modules
        run: |
          uvx ruff@0.16.0 format backend/alembic/versions/20261027_cbt_result_rollback.py backend/app/modules/cbt/results/rollback_models.py backend/app/modules/cbt/results/rollback_schemas.py backend/app/modules/cbt/results/rollback_service.py backend/app/modules/cbt/results/rollback_worker.py backend/app/modules/cbt/results/router.py backend/app/core/queue/heavy_worker.py backend/tests/unit/cbt/test_result_rollback_contract.py backend/tests/unit/queue/test_arq_queue_separation.py
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          if ! git diff --cached --quiet; then
            git commit -m "style(cbt): format rollback modules with Ruff"
            git push origin HEAD:feature/cbt-draft-result-rollback-20261027
          fi
