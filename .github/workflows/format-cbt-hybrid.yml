name: Temporary CBT hybrid Ruff formatter
on:
  push:
    branches:
      - fix/cbt-hybrid-score-resync-20261027
    paths:
      - .github/workflows/format-cbt-hybrid.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cbt-hybrid-score-resync-20261027
      - uses: astral-sh/setup-uv@v5
      - name: Apply Ruff format to changed files
        run: |
          uvx ruff@0.16.0 format backend/app/modules/cbt/results/service.py backend/tests/unit/cbt/test_result_hybrid_resync_contract.py
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          if ! git diff --cached --quiet; then
            git commit -m "style(cbt): format hybrid resync changes"
            git push origin HEAD:fix/cbt-hybrid-score-resync-20261027
          fi
