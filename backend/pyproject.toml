[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
cache_dir = ".pytest_cache"
filterwarnings = [
    "ignore:coroutine 'Connection\\._cancel' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["app", "tests"]
exclude = [
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    "alembic/versions",
]
